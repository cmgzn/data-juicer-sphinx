name: Deploy Sphinx documentation to Pages

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "docs/sphinx_doc/**/*"
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      full:
        description: "Full rebuild of all versions (refreshes theme on old tags, cleans orphan files)"
        type: boolean
        default: false

jobs:
  pages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      PROJECT: ${{ github.event.repository.name }}
      REPO_OWNER: ${{ github.repository_owner }}
      JUICER_API_URL: ${{ vars.JUICER_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@master
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies with uv
        run: |
          uv pip install --system --upgrade pip
          uv pip install --system -e .[all]
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'docs/sphinx_doc/source/_static/package.json'
      - name: Install npm dependencies
        run: |
          cd docs/sphinx_doc/source/_static
          npm install
      - name: Build JavaScript bundle
        run: |
          cd docs/sphinx_doc/source/_static
          npm run build
      - name: Get git tags
        run: |
          git fetch --all --tags
          git branch -a
          git tag
      - id: build
        name: Build Documentation
        run: |
          cd docs/sphinx_doc
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR preview: build the checked-out code only, no worktree
            python build_versions.py --current preview -A
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            # Manual full rebuild: every branch and tag (orphan cleanup + theme refresh)
            python build_versions.py --tags -A
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag push: tags are immutable, build only this tag
            python build_versions.py --branches --tags "${GITHUB_REF_NAME}" -A
          else
            # Branch push (main) or dispatch without full: build only branches
            python build_versions.py -A
          fi
      - name: Generate versions.json
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          cd docs/sphinx_doc
          python build_versions.py --emit-versions-json
      - name: Redirect index.html
        run: |
          REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}"
          cd docs/sphinx_doc
          cp ./redirect.html build/index.html
          sed -i "s/\[REPOSITORY_OWNER\]/${REPOSITORY_OWNER}/g" build/index.html
          sed -i "s/\[PROJECT\]/${PROJECT}/g" build/index.html
          cp build/index.html build/404.html
      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: SphinxDoc
          path: "docs/sphinx_doc/build"
      - uses: peaceiris/actions-gh-pages@v3
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "docs/sphinx_doc/build"
          # Incremental deploy: keep previously published versions untouched,
          # only overwrite the version directory built in this run.
          # A manual full rebuild (full=true) replaces the whole site so that
          # orphan files from deleted versions/pages get cleaned up.
          keep_files: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
